name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (crates/sfi-asm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sfi-asm
      - name: Format
        run: cargo fmt --check --manifest-path crates/sfi-asm/Cargo.toml
      - name: Clippy
        run: cargo clippy --release --all-targets --manifest-path crates/sfi-asm/Cargo.toml -- -D warnings
      - name: Unit tests (incl. determinism)
        run: cargo test --release --manifest-path crates/sfi-asm/Cargo.toml
      - name: Examples build
        run: cargo build --release --examples --manifest-path crates/sfi-asm/Cargo.toml

  backend:
    name: Tauri backend (src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend dist dir to exist.
      - run: mkdir -p dist
      - name: Format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (tests + tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
